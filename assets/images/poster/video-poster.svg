<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D9F4F;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0a7a3d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#065a2b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="360" x2="1280" y2="360"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="600" x2="1280" y2="600"/>
    <line x1="213" y1="0" x2="213" y2="720"/>
    <line x1="427" y1="0" x2="427" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="853" y1="0" x2="853" y2="720"/>
    <line x1="1067" y1="0" x2="1067" y2="720"/>
  </g>

  <!-- Glow band -->
  <rect x="0" y="300" width="1280" height="120" fill="url(#glow)"/>

  <!-- Logo icon (simplified medical cross + pill) -->
  <g transform="translate(640, 280)">
    <!-- Cross -->
    <rect x="-20" y="-50" width="40" height="100" rx="8" fill="#ffffff" opacity="0.9"/>
    <rect x="-50" y="-20" width="100" height="40" rx="8" fill="#ffffff" opacity="0.9"/>
    <!-- Pill capsule -->
    <rect x="30" y="-40" width="16" height="50" rx="8" fill="#D73327" opacity="0.85"/>
    <rect x="30" y="10" width="16" height="50" rx="8" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- Title -->
  <text x="640" y="400" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="#ffffff" letter-spacing="-0.02em">MediFastBD</text>

  <!-- Tagline -->
  <text x="640" y="450" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#ffffff" opacity="0.75">Finding Medicine Faster, Cheaper &amp; Closer.</text>

  <!-- Play button circle -->
  <circle cx="640" cy="560" r="40" fill="#ffffff" opacity="0.15"/>
  <circle cx="640" cy="560" r="36" fill="#ffffff" opacity="0.25"/>
  <polygon points="630,545 630,575 658,560" fill="#ffffff" opacity="0.9"/>

  <!-- Bottom accent line -->
  <rect x="540" y="630" width="200" height="3" rx="1.5" fill="#ffffff" opacity="0.3"/>

  <!-- Team credit -->
  <text x="640" y="670" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#ffffff" opacity="0.5">by Nexora Labs</text>
</svg>
